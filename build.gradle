buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.sandbox.gpay'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sandbox.gpay'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0-sandbox'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
